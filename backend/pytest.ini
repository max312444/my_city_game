[pytest]
asyncio_mode = auto
# Without this, bare `pytest` (as opposed to `python -m pytest`, which prepends the
# CWD to sys.path itself) can't resolve `import app.db` etc. from conftest.py — this
# is exactly what broke CI (see .github/workflows/backend-tests.yml, which runs plain
# `pytest -v`): ModuleNotFoundError: No module named 'app', reproduced locally only
# after testing inside a clean container, since local runs always used `python -m
# pytest` and never hit it.
pythonpath = .
